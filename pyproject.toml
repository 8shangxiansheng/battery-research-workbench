[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-research-workbench"
version = "0.1.1"
description = "Agent-assisted multimodal research workbench for electrical and ultrasonic battery data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "openpyxl>=3.1",
  "pyarrow>=17",
  "zarr>=2.18",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2",
]
pipeline = [
  "kedro>=0.19",
]
tracking = [
  "mlflow>=2.15",
]
ml = [
  "scikit-learn>=1.5",
]
jupyter = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
  "pre-commit>=3.8",
]
all = [
  "battery-research-workbench[agent,pipeline,tracking,ml,jupyter,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require local raw sample files",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The workbench deliberately uses naive datetimes throughout (domain models,
# synchronization clock, parsed manifests) because the source data carries no
# reliable timezone. DTZ rules would reject that core contract, so timezone-
# related rules are ignored at the project level. BRW-008 keeps timezone_known
# explicitly false rather than guessing.
ignore = ["DTZ001", "DTZ005", "DTZ007"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
