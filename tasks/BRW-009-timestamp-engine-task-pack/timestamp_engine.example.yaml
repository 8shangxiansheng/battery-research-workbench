timestamp_engine:
  version: "0.1.0"

  clock:
    model_type: "OFFSET_ONLY"
    scale: 1.0
    offset_s: 0.0
    drift_enabled: false

  validation:
    legacy_timestamp_tolerance_s: 0.000001

  scientific_guards:
    allow_electrical_matching: false
    allow_sync_error: false
    allow_drift_fit: false
    allow_cycle_mapping: false
    allow_verified_sync_status: false
