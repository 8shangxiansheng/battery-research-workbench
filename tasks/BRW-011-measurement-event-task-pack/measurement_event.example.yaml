measurement_event:
  version: "0.1.0"

  quality:
    analysis_eligible_statuses:
      - "READY"

  electrical_enrichment:
    fields:
      - cycle_index_raw
      - step_index_raw
      - step_type
      - voltage_v
      - current_a
      - capacity_ah
      - charge_capacity_ah
      - discharge_capacity_ah
      - energy_wh
      - power_w
      - temperature_c
      - soc_dod_percent
      - contact_resistance_mohm
      - dq_dv_raw

  scientific_guards:
    allow_timestamp_rematching: false
    allow_ambiguous_candidate_selection: false
    allow_interpolation: false
    allow_drift_correction: false
    allow_feature_extraction: false
    allow_validated_sync_upgrade: false
