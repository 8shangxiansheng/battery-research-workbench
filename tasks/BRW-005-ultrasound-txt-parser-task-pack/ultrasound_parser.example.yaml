ultrasound_parser:
  version: "0.1.0"

  expected_current_format:
    semicolon_sections: 6
    waveform_samples_per_frame: 1250
    unknown_tail_values: 16

  validation:
    require_nonempty_file: true
    require_numeric_frame_index: true
    require_numeric_elapsed_time: true
    require_monotonic_elapsed_time: true
    require_fixed_waveform_length: true
    silently_skip_invalid_lines: false

  storage:
    frame_metadata_format: parquet
    waveform_format: zarr
    waveform_dtype: int32
    one_group_per_asset: true

  scientific_guards:
    sampling_rate_hz: null
    allow_absolute_tof: false
    allow_frequency_axis_hz: false
    preserve_unknown_metadata: true
    no_signal_transformation: true
