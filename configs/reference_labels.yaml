reference_labels:
  version: "0.1.0"
  label_definition_version: "0.1.0"

  soc:
    method: "COULOMB_COUNTING_PROTOCOL_ANCHORED"
    formula_version: "0.1.0"
    # The vendor SOC/DOD(%) field is a mixed field (0->100 in BOTH charge and
    # discharge); it is never promoted to a reference label.
    promote_vendor_soc_dod: false

  soh:
    method: "CAPACITY_BASELINE_RATIO"
    formula_version: "0.1.0"
    reference_capacity_source: "BASELINE_CYCLE"
    # Set only when an independently evidenced RPT capacity exists.
    rpt_capacity_ah: null

  leakage:
    frame_random_split_prohibited: true

  tof:
    reserved_algorithm_version: "0.1.0-reserved"
