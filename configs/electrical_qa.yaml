electrical_qa:
  version: "0.1.0"
  schema:
    required_columns:
      - battery_id
      - experiment_id
      - electrical_asset_id
      - source_file
      - source_sheet
      - source_row_index
      - timestamp
      - cycle_index_raw
      - step_index_raw
      - current_a
      - voltage_v
      - capacity_ah
  temporal:
    duplicate_timestamps_are_fatal: false
    large_gap_warning_s: 5.0
  physical_bounds:
    voltage_v: {min: 0.0, max: 5.0}
    current_a: {min: -30.0, max: 30.0}
    capacity_ah: {min: 0.0, max: 1000.0}
    temperature_c: {min: -20.0, max: 80.0}
    soc_dod_percent: {min: 0.0, max: 100.0}
  cross_table:
    timestamp_tolerance_s: 1.0
    numeric_relative_tolerance: 0.01
  figures:
    dpi: 150
    format: png
