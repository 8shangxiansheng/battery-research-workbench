timestamp_engine:
  version: "0.1.0"

  clock:
    # V1 clock model is OFFSET_ONLY: absolute = anchor + (elapsed - elapsed_at_anchor).
    model_type: "OFFSET_ONLY"
    scale: 1.0
    offset_s: 0.0
    drift_enabled: false

  validation:
    # Tolerance for comparing BRW-009 derived timestamps against the BRW-005
    # parser-level absolute_timestamp (legacy compatibility diagnostic only).
    legacy_timestamp_tolerance_s: 0.000001

  scientific_guards:
    # BRW-009 never performs cross-modal matching, drift fit, cycle mapping,
    # or reports verified synchronization.
    allow_electrical_matching: false
    allow_sync_error: false
    allow_drift_fit: false
    allow_cycle_mapping: false
    allow_verified_sync_status: false
