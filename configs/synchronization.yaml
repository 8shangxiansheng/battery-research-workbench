synchronization:
  version: "0.1.0"

  # Legacy/primary-key metadata retained for the synchronization architecture.
  primary_key: timestamp
  strategy: nearest_timestamp

  # V1 nearest-record matching policy.
  matching:
    method: "nearest"
    max_sync_error_s: 1.0
    tie_tolerance_s: 0.000000001
    ambiguous_selection: "none"

  boundary:
    duplicate_timestamp_is_boundary: true
    detect_cycle_transition: true
    detect_step_transition: true
    use_explicit_start_end_marker_if_available: true

  reporting:
    sync_error_p95: true
    required_figures: 4

  scientific_guards:
    allow_drift_correction: false
    allow_interpolation: false
    allow_cycle_based_matching: false
    allow_step_based_matching: false
    allow_measurement_event: false
    allow_verified_sync_upgrade: false

  # Cycle/Step are labels inherited AFTER time alignment.
  map_cycle_after_alignment: true
  map_step_after_alignment: true

  time_anchor:
    prefer_asset_file_start_time: true
    allow_experiment_start_fallback: true

  clock_model:
    mode: offset_only
    offset_s: 0.0
    rate: 1.0

  quality:
    target_match_rate: 0.99
    max_allowed_sync_error_s: 0.75
    boundary_tolerance_s: 1.0
    expose_sync_error: true

  drift_detection:
    enabled: true
    correction_enabled: false
